// AnantPlay Sinhala Player v3.4.6 — the host root build.
//
// The Flutter module (ui/) carries its own generated Gradle binding
// (ui/.android/include_flutter.groovy + module_plugin_loader.gradle), so this
// root project only needs the repositories and a clean task.
//
// The original delta shipped a "# " comment line here, which Groovy does not
// accept (it is only valid in shell/Properties files) — that alone made any
// Gradle invocation fail. Fixed in v3.4.6.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
