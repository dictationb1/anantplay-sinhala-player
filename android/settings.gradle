// AnantPlay Sinhala Player v3.4.6.a — the Option-A Gradle host settings.
//
// This host WRAPS the existing pure-Java backend (src/, res/, assets/,
// libs/*.jar — Media3 1.11.1 + Guava 33.3.1) and embeds the Flutter module
// ui/ (the Mornye v5.4.0 Liquid-Glass engine, vendored LGPL-3.0-only) through
// the standard add-to-app contract.
//
// WHY local.properties IS OPTIONAL HERE (v3.4.6 fix):
//   The Flutter SDK path is resolved from FLUTTER_ROOT first (CI exports it via
//   subosito/flutter-action) and only then from android/local.properties (a
//   developer machine). local.properties is a MACHINE-LOCAL file and is never
//   committed — see .gitignore; the Gradle build must not require it.
pluginManagement {
    def flutterSdkPath = {
        def fromEnv = System.getenv("FLUTTER_ROOT")
        if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
        def props = new Properties()
        def localProps = new File(settingsDir, "local.properties")
        if (!localProps.exists()) {
            throw new GradleException(
                "Flutter SDK not found: set FLUTTER_ROOT (CI) or write " +
                "android/local.properties with flutter.sdk=<path> (local dev).")
        }
        localProps.withInputStream { props.load(it) }
        def sdk = props.getProperty("flutter.sdk")
        if (sdk == null) throw new GradleException("flutter.sdk not set in local.properties")
        return sdk
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Flutter 3.50.1 → AGP 9.3.1 → Gradle 9.5.0 (the pinned, compatible trio).
    id "com.android.application" version "9.3.1" apply false
}

include ":app"

rootProject.name = "anantplay_host"

// The Flutter module include (add-to-app): evaluates ui/.android/include_flutter.groovy,
// which is generated by `flutter pub get` (ui/.android is git-ignored and ephemeral).
setBinding(new Binding([gradle: this]))
evaluate(new File(settingsDir.parentFile, "ui/.android/include_flutter.groovy"))
