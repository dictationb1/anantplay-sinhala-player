# AnantPlay Sinhala Player v3.4.6.a — host Gradle properties.
#
# FLUTTER 3.50.1 RUNS ON JAVA 17+ (AGP 9.3.1 requires Gradle 9.5.0, and both
# require a modern JDK). The heap is bounded so a 4 GB CI runner never OOMs.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=false

# THE EXISTING PURE-JAVA BACKEND IS android.useAndroidX-AGNOSTIC: it links only
# android.jar + libs/*.jar. The Flutter engine (an AAR that itself depends on
# AndroidX) is embedded in the SAME app module, so AndroidX must be ON or the
# app module cannot resolve the engine's transitive androidx.* classes.
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false
