name: Build Sinhala Player APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# One run per branch/PR: a new push cancels the stale run instead of queueing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lab:
    name: Cast protocol lab (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Repo hygiene + zero-accessibility proof
        run: |
          set -euo pipefail
          echo "--- tracked .zip files (must be 0) ---"
          ZIPS=$(git ls-files '*.zip' | wc -l)
          echo "zip files tracked: $ZIPS"
          [ "$ZIPS" -eq 0 ]
          echo "--- AccessibilityService API usage in the shipped app (must be 0) ---"
          python3 -c "import re,sys;sys.stdout.write(re.sub(r'<!--.*?-->','',open('AndroidManifest.xml',encoding='utf-8').read(),flags=re.S))" > /tmp/manifest.xml
          if grep -nE 'BIND_ACCESSIBILITY_SERVICE|android\.accessibilityservice|<service[^>]*Accessibility' /tmp/manifest.xml; then
            echo "::error title=Zero-accessibility violated::an AccessibilityService declaration was found in AndroidManifest.xml"
            exit 1
          fi
          if grep -rnE 'extends AccessibilityService|AccessibilityServiceInfo|BIND_ACCESSIBILITY_SERVICE' src/ lab/; then
            echo "::error title=Zero-accessibility violated::an AccessibilityService API reference was found in the app sources"
            exit 1
          fi
          echo "AccessibilityService declarations: 0, API references: 0"
          echo "--- forbidden signed artifacts in the tree (must be 0) ---"
          git ls-files '*.apk' '*.jks' '*.keystore' '*.p12' | wc -l

      - name: Compile the engines + run the cast-protocol lab (mandatory)
        run: |
          chmod +x lab/run_lab.sh
          bash lab/run_lab.sh

      - name: Summarise the lab report
        if: always()
        run: |
          {
            echo '### Cast protocol lab'
            echo ''
            echo '```'
            grep -E 'Lab result|  PASS |  FAIL ' lab/out/lab.txt | head -80 || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-report
          path: lab/out/
          if-no-files-found: ignore
          retention-days: 14

  apk:
    name: APK (JDK 17 + Android SDK 34, signed + verified)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No third-party SDK action: the GitHub Ubuntu image already ships an Android
      # SDK; we only fill in what is missing, and we say exactly what we found.
      - name: Prepare Android SDK (platform 34 + build-tools)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          [ -d "$SDK" ] || SDK="$HOME/android-sdk"
          echo "SDK candidate: $SDK"
          echo "ANDROID_HOME was: ${ANDROID_HOME:-unset}"
          ls "$SDK" 2>/dev/null || true
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true

          SDKM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager" "$(command -v sdkmanager || true)"; do
            [ -x "$c" ] && { SDKM="$c"; break; }
          done
          echo "sdkmanager: ${SDKM:-not found}"
          if [ -n "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          fi

          NEED=""
          [ -f "$SDK/platforms/android-34/android.jar" ] || NEED="$NEED platforms;android-34"
          ls "$SDK"/build-tools/*/aapt2 > /dev/null 2>&1 || NEED="$NEED build-tools;35.0.1"
          if [ -n "$NEED" ]; then
            echo "installing:$NEED"
            [ -n "$SDKM" ] || { echo "::error::no sdkmanager available to install$NEED"; exit 1; }
            "$SDKM" --sdk_root="$SDK" --install $NEED < /dev/null
          fi
          [ -f "$SDK/platforms/android-34/android.jar" ] || { echo "::error::android-34 platform missing"; exit 1; }
          ls "$SDK"/build-tools/*/aapt2 > /dev/null 2>&1 || { echo "::error::build-tools missing"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "--- final ---"; ls "$SDK/platforms"; ls "$SDK/build-tools"

      - name: Build + sign + verify the APK
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_KEYPASS: ${{ secrets.KS_KEYPASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          set -euo pipefail
          chmod +x build.sh
          bash build.sh

      - name: Assert the artifact is a real, signed, installable APK
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=dist/AnantPlay-Sinhala-Player.apk
          test -s "$APK"
          echo "size: $(stat -c %s "$APK") bytes"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c 4 "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion)"
          unzip -l "$APK" | grep -E "classes.*dex|AndroidManifest.xml|assets/fonts/NotoSansSinhala-Regular.ttf"
          sha256sum "$APK" | tee dist/sha256.txt

      - name: Upload the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AnantPlay-Sinhala-Player-apk
          path: dist/AnantPlay-Sinhala-Player.apk
          if-no-files-found: error
          retention-days: 90

      - name: APK summary
        if: always()
        run: |
          {
            echo '### Signed APK'
            echo ''
            echo '| item | value |'
            echo '| --- | --- |'
            echo "| file | AnantPlay-Sinhala-Player.apk |"
            if [ -f dist/AnantPlay-Sinhala-Player.apk ]; then
              echo "| bytes | $(stat -c %s dist/AnantPlay-Sinhala-Player.apk) |"
            fi
            if [ -f dist/sha256.txt ]; then
              echo "| sha256 | $(cut -d' ' -f1 dist/sha256.txt) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
