name: Release APK (signed, Obtainium-ready)

# v3.4.6 — reproducible APKs: build.sh pins every ZIP entry to a fixed epoch and
# TZ=UTC is set here so the runner clock is interpretable.
env:
  TZ: UTC

# v3.x — THE MERGE-TO-RELEASE PIPELINE: every Pull Request merged into main
# becomes a release automatically. No tag ceremony, no manual step.
#
#   Trigger A — push to main (a merged PR):   the workflow extracts
#     VERSION_NAME/VERSION_CODE from build.sh, checks whether the tag
#     v<VERSION_NAME> already exists (→ exit cleanly, no duplicate release),
#     and when it is NEW and the permanent signing secrets are configured:
#     Lab gate (100% PASS) → Gradle host build + sign → verify → SHA256SUMS.txt →
#     create+push the tag → publish the GitHub Release with EXACTLY ONE .apk
#     asset (AnantPlay-Sinhala-Player-v<ver>.apk) + SHA256SUMS.txt.
#     When KS_BASE64 is not configured, a push to main logs a friendly summary
#     notice and exits green (build-apk.yml still builds + attaches the APK).
#   Trigger B — push a semantic tag: git tag v3.4.6.c && git push origin v3.4.6.c
#   Trigger C — 1-click manual dispatch (takes a version, creates the tag).
#
# v3.4.6 — the APK now comes from the GRADLE HOST (android/ + the Flutter
# module ui/), because the app embeds the Flutter engine. build.sh remains the
# pure-Java reference recipe used by the Lab; the release no longer calls it.
#
# SIGNING (the zero-uninstall contract, byte-identical names everywhere):
#   KS_BASE64 / KS_PASS / KS_KEYPASS / KS_ALIAS — the permanent release secrets
#   made by scripts/create-release-keystore.sh (or .ps1).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 3.4.6.c — no leading v)'
        required: true
        default: "3.4.6.j"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # creating the tag + the Release

jobs:
  release:
    name: Lab gate → signed APK → GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tag-exists check needs the real tag list

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ── 1. resolve the version (build.sh defaults / tag / manual input) ────
      - name: Resolve the release version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            # push to main: the version comes from build.sh itself (the file
            # that ships) — VERSION_NAME=${VERSION_NAME:-<default>}
            V=$(grep -o 'VERSION_NAME=${VERSION_NAME:-[^}]*}' build.sh | head -1 | sed 's/.*:-\([^}]*\)}/\1/')
          fi
          # v3.4.6.d — THE ALPHABETICAL SCHEME, WIDENED FOR GOOD: X.Y.Z[.a-z].
          # NO REGEX CEILING ANYWHERE: .e, .f … .z derive cleanly, forever.
          #
          # Two codepoint regimes, one strictly-increasing ladder:
          #
          #  A. LEGACY LANE (base ≤ 30406 — the already-shipped 3.4.0..3.4.6
          #     numerics and their a–z emergency letters): CODE = BASE + LETTER,
          #     so 3.4.6.c=30409, 3.4.6.d=30410, 3.4.6.e=30411 (the permanent strict lock),
          #     3.4.6.e=30411 … 3.4.6.z=30432. These exact codes must never move:
          #     they are burned into shipped APKs and users' update paths.
          #
          #  B. WIDE LANE (every base > 30406 — 3.4.7 onward, forever):
          #     CODE = MAJOR*1000000 + MINOR*10000 + PATCH*100 + LETTER.
          #     Each numeric version gets a 100-wide lane, so its own a–z letters
          #     (1…26) always fit BELOW the next numeric version, and the next
          #     numeric version always sits above the whole previous lane:
          #         3.4.7 = 3040700   (… 3.4.7.z = 3040726)
          #         3.4.8 = 3040800   (… 3.4.8.z = 3040826)
          #         3.5.0 = 3050000   (… 3.5.0.z = 3050026)
          #         4.0.0 = 4000000
          #     This is why the lane is multiplicative: a +1 letter step and a
          #     +1 patch step can never collide again (the 30407 = 3.4.6.a trap
          #     that originally forced "+9" hacks and a .d ceiling).
          #     ≥ 30411 on entry, so the ladder never regresses past the live
          #     3.4.6.d build, and the ceiling is Android's own 2.1e9.
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[a-z])?$' || { echo "::error::version '$V' is not X.Y.Z[.a-z]"; exit 1; }
          MAJOR=$(echo "$V" | cut -d. -f1); MINOR=$(echo "$V" | cut -d. -f2); PATCH=$(echo "$V" | cut -d. -f3)
          SUFFIX=$(echo "$V" | sed -n 's/^[0-9]*\.[0-9]*\.[0-9]*\.\([a-z]\)$/\1/p')
          LETTER=0
          if [ -n "$SUFFIX" ]; then
            # a→1 … z→26, derived arithmetically so the WHOLE alphabet works —
            # no case list that could ever go stale at .e, .f, .g …
            LETTER=$(printf '%d' "'$SUFFIX")
            LETTER=$((LETTER - 96))
          fi
          BASE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [ "$BASE" -le 30406 ]; then
            # A. LEGACY LANE — the shipped 3.4.0..3.4.6 history, unchanged.
            CODE=$((BASE + LETTER))
          else
            # B. WIDE LANE — 3.4.7 and every future release, letters included.
            CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + LETTER))
          fi
          # ── the global monotonic guarantee: never below the live 3.4.6.f ────
          # 3.4.6.f itself is 30412 (this release); everything after it must be
          # strictly higher, so no shipped build can ever be "updated" downward.
          # v3.4.6.h: the previous live tiers .f/.g (30412/30413) join the pinned ladder.
          if [ "$V" = "3.4.6.e" ]; then
            [ "$CODE" -eq 30411 ] || { echo "::error::3.4.6.e must derive exactly 30411 (got $CODE)"; exit 1; }
          elif [ "$V" = "3.4.6.f" ]; then
            [ "$CODE" -eq 30412 ] || { echo "::error::3.4.6.f must derive exactly 30412 (got $CODE)"; exit 1; }
          else
            [ "$CODE" -gt 30412 ] || { echo "::error::derived versionCode $CODE for '$V' is not above the live 3.4.6.f (30412)"; exit 1; }
          fi
          # the wide lane reserves 100 slots per numeric version; a patch or minor
          # of 100+ would spill into the next lane, so it is refused loudly.
          if [ "$BASE" -gt 30406 ] && { [ "$PATCH" -ge 100 ] || [ "$MINOR" -ge 100 ]; }; then
            echo "::error::minor and patch must be < 100 (got $MINOR / $PATCH) — the 100-slot letter lane would collide"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "releasing v$V (versionCode $CODE)"

      # ── 2. the merge-to-release gate: an existing tag means "already released" ─
      - name: Skip when the tag already exists (merge-to-release idempotence)
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice title=Release skipped::tag $TAG already exists — nothing new to release (no duplicate release error)."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      # ── 3. a push to main without the permanent keystore: a FRIENDLY notice ─
      - name: Check the signing secrets (friendly on push-to-main, strict on tags)
        if: env.SKIP != 'true'
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KS_BASE64" ]; then
            if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error title=No signing key::KS_BASE64 is not set. Run scripts/create-release-keystore.sh (or .ps1) once and add the 4 secrets (KS_BASE64, KS_PASS, KS_KEYPASS, KS_ALIAS). A debug-signed RELEASE would break in-place updates for every user."
              exit 1
            fi
            {
              echo "### ℹ️ Release skipped — no signing key configured"
              echo ""
              echo "This push to \`main\` merged cleanly, but the permanent release keystore secrets"
              echo "(KS_BASE64 / KS_PASS / KS_KEYPASS / KS_ALIAS) are not configured yet, so no"
              echo "GitHub Release was published. Everything else (the Lab gate, the APK build) ran"
              echo "in the build-apk.yml workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      # ── 4. the Lab MUST pass before anything is released ───────────────────
      - name: Cast protocol lab (gating)
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          chmod +x lab/run_lab.sh
          bash lab/run_lab.sh
          PASSED=$(grep -c '  PASS ' lab/out/lab.txt || true)
          FAILED=$(grep -c '  FAIL ' lab/out/lab.txt || true)
          echo "::notice title=Lab::${PASSED}/$((PASSED+FAILED)) PASS — releasing v${{ steps.ver.outputs.version }}"
          [ "$FAILED" -eq 0 ]

      # ── 5. the Android toolchain (build-tools 35.0.1 is a HARD requirement) ─
      - name: Prepare Android SDK (platform 36 + build-tools 35.0.1)
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          [ -d "$SDK" ] || SDK="$HOME/android-sdk"
          SDKM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager" "$(command -v sdkmanager || true)"; do
            [ -x "$c" ] && { SDKM="$c"; break; }
          done
          if [ -n "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          fi
          NEED=""
          [ -f "$SDK/platforms/android-36/android.jar" ] || NEED="$NEED platforms;android-36"
          [ -x "$SDK/build-tools/35.0.1/aapt2" ] || NEED="$NEED build-tools;35.0.1"
          if [ -n "$NEED" ]; then
            [ -n "$SDKM" ] || { echo "::error::no sdkmanager available to install$NEED"; exit 1; }
            "$SDKM" --sdk_root="$SDK" --install $NEED < /dev/null
          fi
          [ -x "$SDK/build-tools/35.0.1/aapt2" ] || { echo "::error::build-tools;35.0.1 missing"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # ── 6. the Flutter + Gradle toolchain (Flutter 3.50.1 / Gradle 9.5.0) ──
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
        if: env.SKIP != 'true'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
        if: env.SKIP != 'true'

      - name: 'Build + sign the release APK (Gradle host: Media3 backend + Flutter UI)'
        if: env.SKIP != 'true'
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_KEYPASS: ${{ secrets.KS_KEYPASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          cd ui
          for f in InterVariable.ttf GoogleSansFlex.ttf Inter-LICENSE.txt GoogleSansFlex-LICENSE.txt; do
            if [ ! -s "assets/fonts/$f" ]; then
              curl -fsSL --max-time 120 -o "assets/fonts/$f" \
                "https://github.com/mornyeapp/Mornye/raw/c4a1c7b812eb135d6e1a295b6b25e11abbd72a7e/assets/fonts/$f"
              test -s "assets/fonts/$f"
            fi
          done
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile || flutter pub get
          else
            flutter pub get
          fi
          cd ..
          # local.properties is machine-local, never committed: CI writes it.
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          test -f ui/.android/include_flutter.groovy || { echo "::error::ui/.android/include_flutter.groovy missing"; exit 1; }
          printf '%s' "$KS_BASE64" | base64 -d > build_release.keystore
          test -s build_release.keystore
          set +e
          ( cd android && ./gradlew assembleRelease --no-daemon --stacktrace \
              -PKS_FILE="$PWD/../build_release.keystore" -PKS_PASS="$KS_PASS" \
              -PKS_KEYPASS="${KS_KEYPASS:-$KS_PASS}" -PKS_ALIAS="${KS_ALIAS:-sicast}" ) > /tmp/gradle.log 2>&1
          RC=$?
          set -e
          {
            echo '### Release Gradle build (Option A)'
            echo ''
            echo '```'
            tail -120 /tmp/gradle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -ne 0 ]; then
            grep -E "^e: |error:|FAILURE|error •|Caused by" /tmp/gradle.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          mkdir -p dist
          APK_OUT=$(find android/app/build/outputs/apk/release -name 'app-release*.apk' | head -1)
          test -n "$APK_OUT"
          echo "gradle produced: $APK_OUT"
          # the versioned name is THE name: badging/zipalign/apksigner AND the
          # SHA256SUMS.txt entry all reference exactly this path.
          cp "$APK_OUT" "dist/AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk"
          test -s "dist/AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk"

      # v3.4.6.c — TRAP #1: THE 16 KB ZIP PASS, THEN apksigner (the auditable
      # order: alignment REWRITES the zip, so sign comes AFTER it). `-P 16`
      # puts every uncompressed .so on a 16,384-byte offset inside the APK —
      # the Android 16 mmap-straight-from-package contract that
      # verify_apk_launch_integrity.py (L1z) then proves on the artifact.
      - name: 'zipalign -P 16 (Android 16 KB zip contract) + apksigner re-sign'
        if: env.SKIP != 'true'
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_KEYPASS: ${{ secrets.KS_KEYPASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="dist/AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk"
          test -s "$APK"
          "$BT/zipalign" -P 16 -f 4 "$APK" dist/aligned.apk
          test -s dist/aligned.apk
          echo "zipalign -P 16 -f 4: exit 0"
          if [ ! -s build_release.keystore ]; then
            printf '%s' "$KS_BASE64" | base64 -d > build_release.keystore
          fi
          test -s build_release.keystore
          "$BT/apksigner" sign \
            --ks build_release.keystore \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:${KS_KEYPASS:-$KS_PASS}" \
            --ks-key-alias "${KS_ALIAS:-sicast}" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/signed.apk dist/aligned.apk
          test -s dist/signed.apk
          mv dist/signed.apk "$APK"
          rm -f dist/aligned.apk
          "$BT/zipalign" -c -P 16 4 "$APK"
          echo "::notice title=zipalign::zipalign -P 16 -f 4 applied, zipalign -c -P 16 4 OK (release APK)"

      - name: Verify the release APK (signature + version + assets)
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="dist/AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk"
          test -s "$APK"
          SIZE=$(stat -c %s "$APK")
          test "$SIZE" -lt 52428800 || { echo "::error::APK must be strictly below 50 MiB (got $SIZE bytes)"; exit 1; }
          echo "size: $SIZE bytes (< 50 MiB)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          # the release contract: BOTH schemes, verified, on the exact artifact
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt \
            || { echo "::error::the APK is not v2-signed"; exit 1; }
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/apksigner.txt \
            || { echo "::error::the APK is not v3-signed"; exit 1; }
          # v3.4.6.c — TRAP #1: the REAL Android 16 check (-P 16), not plain -c 4
          "$BT/zipalign" -c -P 16 4 "$APK"
          "$BT/aapt2" dump badging "$APK" | head -2
          "$BT/aapt2" dump badging "$APK" | head -1 | grep -q "versionCode='${{ steps.ver.outputs.code }}'" \
            || { echo "::error::versionCode mismatch"; exit 1; }
          "$BT/aapt2" dump badging "$APK" | head -1 | grep -q "versionName='${{ steps.ver.outputs.version }}'" \
            || { echo "::error::versionName mismatch"; exit 1; }
          "$BT/aapt2" dump badging "$APK" | grep -q "targetSdkVersion:'36'" \
            || { echo "::error::targetSdkVersion must be 36"; exit 1; }
          "$BT/aapt2" dump badging "$APK" | head -1 | grep -q "package: name='lk.techworld.anantplay.sicast'" \
            || { echo "::error::applicationId mismatch"; exit 1; }
          unzip -l "$APK" | grep -q "assets/fonts/NotoSansSinhala-Regular.ttf"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libflutter.so"
          unzip -l "$APK" | grep -E "classes.*dex|lib/arm64-v8a/libflutter.so"
          # v3.4.6.c — THE LAUNCH-INTEGRITY GATE (same script as build-apk.yml):
          # 16 KB-page ELF audit of every packaged .so, one-ABI contract,
          # launch-critical libapp.so + asset pair, manifest identity, v2+v3.
          # v3.4.6 shipped dead-on-arrival with every gate above green — this
          # is the gate that catches that class before a release exists.
          python3 lab/verify_apk_launch_integrity.py "$APK" "${{ steps.ver.outputs.version }}"

      - name: SHA256SUMS.txt (the integrity file next to the APK)
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          cd dist
          APK="AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk"
          sha256sum "$APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── 6b. v3.4.2 — docs/latest.json: the updater's TIER-2 resolver source ──
      # The in-app updater reads https://raw.githubusercontent.com/<repo>/main/
      # docs/latest.json BEFORE ever touching api.github.com (the zero-rate-limit
      # contract). This step writes it back to main after every release.
      - name: Publish docs/latest.json (the updater's tier-2 endpoint)
        if: env.SKIP != 'true' && github.ref_type != 'tag' && github.event_name == 'push'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          CODE="${{ steps.ver.outputs.code }}"
          SHA=$(cut -d' ' -f1 dist/SHA256SUMS.txt)
          mkdir -p docs
          # EXACT tier-2 contract parsed by SelfUpdateCore.fetchViaRawJsonBody():
          # version / code / sha256 / apkUrl (sha256 must be 64 lowercase hex).
          printf '{"version":"%s","code":%s,"sha256":"%s","apkUrl":"https://github.com/dictationb1/anantplay-sinhala-player/releases/download/v%s/AnantPlay-Sinhala-Player-v%s.apk"}\n' \
            "$V" "$CODE" "$SHA" "$V" "$V" > docs/latest.json
          python3 - "$V" "$CODE" <<'PY'
          import json, sys
          v, code = sys.argv[1], int(sys.argv[2])
          d = json.load(open("docs/latest.json", encoding="utf-8"))
          assert d["version"] == v, d
          assert d["code"] == code, d
          assert len(d["sha256"]) == 64 and d["sha256"].lower() == d["sha256"], d
          assert d["apkUrl"].endswith("/AnantPlay-Sinhala-Player-v%s.apk" % v), d
          PY
          cat docs/latest.json
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          git add docs/latest.json
          # No-empty-commit guard: nothing staged AND nothing on disk → skip.
          if git diff --quiet -- docs/latest.json && git diff --cached --quiet -- docs/latest.json; then
            echo "::notice::docs/latest.json already current — no commit needed"
          else
            # [skip ci] is belt-and-braces: a GITHUB_TOKEN push cannot start a
            # new run, and this marker guarantees no recursive workflow loop.
            git commit -m "chore(release): docs/latest.json v$V (updater tier-2 endpoint) [skip ci]"
            PUSHED=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then PUSHED=1; break; fi
              echo "::warning title=docs/latest.json::push attempt $attempt rejected — rebasing onto origin/main and retrying"
              git fetch --quiet origin main || true
              if git rebase --quiet origin/main; then
                if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then PUSHED=1; break; fi
                if git diff --quiet -- docs/latest.json && git diff --cached --quiet -- docs/latest.json; then PUSHED=1; break; fi
              else
                git rebase --abort || true
                break
              fi
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "::warning title=docs/latest.json::automatic push was rejected (branch protection?) — the Release itself is unaffected; tier-2 will refresh on the next release"
            fi
          fi

      # ── 7. the tag (created for merge-to-release + manual dispatch) ────────
      - name: Create + push the git tag
        if: env.SKIP != 'true' && github.ref_type != 'tag'
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::tag $TAG already exists — reusing it"
          else
            git config user.name "release-bot"
            git config user.email "actions@github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # ── 8. the Release: EXACTLY ONE .apk asset + SHA256SUMS.txt ────────────
      - name: Publish the GitHub Release (one APK + SHA256SUMS)
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AnantPlay Sinhala Player v${{ steps.ver.outputs.version }}
          body: |
            # AnantPlay සිංහල Player v${{ steps.ver.outputs.version }}

            **Zero fork · zero accessibility · official AnantPlay untouched.**

            ## What is in this release
            - **The Mornye v5.4.0 Liquid-Glass Flutter UI** (vendored LGPL-3.0-only,
              `ui/lib/mornye_ui/`) hosted by a `FlutterActivity` over the SAME
              pure-Java backend: Home · Settings · Help · Onboarding, with the
              native Media3 player and the Cinema WebView browser a tap away.
            - Cast, three redundant ways: NsdManager + our own RFC-6762 mDNS
              responder (TTL 255, pinned egress, always-multicast replies) +
              a UPnP/DLNA MediaRenderer (SSDP).
            - Built-in WebView Cinema Browser with the live stream sniffer:
              "🎬 සිංහල උපසිරැසි සමඟ බලන්න" — zero Cast needed, works on any network.
            - App-open auto-updater (checks the moment the app opens + every 4 h,
              live progress, SHA-256-verified, temp files always cleaned) with a
              55 MiB download cap.

            ## Install / update
            - **In-app**: Settings → Updates (or just open the app).
            - **Obtainium users**: detected automatically (one unambiguous
              `.apk` asset). Updates install in place — no uninstall ever.
            - **Manual**: download `AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk`
              and install over the previous version (same permanent signing key).
            - Verify with `SHA256SUMS.txt`.

            Full story: `docs/reports/V3_4_6_MORNYE_FLUTTER_UI_RELEASE_REPORT.md` in the repo.
          files: |
            dist/AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Release summary
        if: always()
        run: |
          {
            echo '### Release pipeline'
            echo ''
            echo '| item | value |'
            echo '| --- | --- |'
            echo "| trigger | ${{ github.event_name }} (${{ github.ref }}) |"
            echo "| version | ${{ steps.ver.outputs.version }} (versionCode ${{ steps.ver.outputs.code }}) |"
            echo "| apk | AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk |"
            if [ -f dist/SHA256SUMS.txt ]; then
              echo "| sha256 | $(cut -d' ' -f1 dist/SHA256SUMS.txt) |"
            fi
            echo "| outcome | ${{ env.SKIP == 'true' && 'skipped (tag exists / no signing key — see the notice above)' || 'released' }} |"
            echo "| signing | ${{ secrets.KS_BASE64 != '' && 'permanent release keystore' || 'not configured' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
