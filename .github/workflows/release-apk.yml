name: Release APK (signed, Obtainium-ready)

# THE RELEASE PIPELINE (v2.3.1):
#   Trigger A — push a semantic tag:  git tag v2.3.1 && git push origin v2.3.1
#   Trigger B — 1-click manual: the "Run workflow" button takes a version (e.g. 2.3.1);
#               the workflow verifies the Lab passes, builds + signs with the PERMANENT
#               keystore (GitHub Secrets), verifies the signature, writes SHA256SUMS.txt,
#               creates the tag (when dispatched), and publishes a GitHub Release whose
#               ONLY APK asset is AnantPlay-Sinhala-Player-v<version>.apk (+ SHA256SUMS.txt)
#               — exactly one unambiguous .apk so Obtainium needs zero regex guessing.
#
# SIGNING (the zero-uninstall contract):
#   KS_BASE64 / KS_PASS / KS_KEYPASS / KS_ALIAS are the permanent release secrets made by
#   scripts/create-release-keystore.sh (or .ps1). With them set, EVERY release is signed
#   by the same key → Obtainium updates in place, no uninstall, ever. Without them the
#   workflow REFUSES to publish a release (a debug-signed release would break updates).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.3.1 — no leading v)'
        required: true
        default: '2.3.1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # creating the tag + the Release

jobs:
  release:
    name: Lab gate → signed APK → GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ── 1. resolve the version (tag trigger or manual input) ──────────────
      - name: Resolve the release version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version '$V' is not X.Y.Z"; exit 1; }
          MAJOR=$(echo "$V" | cut -d. -f1); MINOR=$(echo "$V" | cut -d. -f2); PATCH=$(echo "$V" | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "releasing v$V (versionCode $CODE)"

      # ── 2a. FAIL FAST: no permanent keystore → refuse the whole release ────
      # BEFORE any expensive work (lab, SDK install, build). A debug-signed
      # release would break in-place updates for every user (and pollute Obtainium's
      # update lineage), so this must refuse at the earliest possible point.
      - name: Refuse the release without the permanent signing key
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KS_BASE64" ]; then
            echo "::error title=Release refused: no permanent signing key::KS_BASE64 is not set. Run scripts/create-release-keystore.sh (or .ps1 — one time), add the 4 secrets (KS_BASE64, KS_PASS, KS_KEYPASS, KS_ALIAS) under Settings → Secrets and variables → Actions, then re-run this workflow. A debug-signed RELEASE would break in-place updates for every user."
            exit 1
          fi
          echo "permanent signing key present — release can proceed"

      # ── 2b. resolve the previous release's versionCode ────────────────────
      # The strictly-increasing versionCode guard in build.sh needs the PREVIOUS
      # release's versionCode. The FIRST-EVER release has no previous release —
      # the API answers 404, which must default to 0 cleanly (never crash on
      # empty API output). Any later tag-style release (v2.2.0, v2.1.0, …) derives
      # its predecessor from the latest existing GitHub Release.
      - name: Resolve the previous release version code
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREV=0
          PREV_TAG=""
          if TAG_OUT=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null); then
            PREV_TAG="$TAG_OUT"
            if echo "$PREV_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              PREV_V="${PREV_TAG#v}"
              MAJ=$(echo "$PREV_V" | cut -d. -f1); MIN=$(echo "$PREV_V" | cut -d. -f2); PAT=$(echo "$PREV_V" | cut -d. -f3)
              PREV=$((MAJ * 10000 + MIN * 100 + PAT))
            fi
          else
            echo "no previous release found (first-ever release) — PREV_VERSION_CODE=0"
          fi
          echo "previous_version_code=$PREV" >> "$GITHUB_OUTPUT"
          echo "previous release: tag=${PREV_TAG:-<none>} code=$PREV"

      # ── 3. the Lab MUST pass before anything is released ──────────────────
      - name: Cast protocol lab (gating)
        run: |
          set -euo pipefail
          chmod +x lab/run_lab.sh
          bash lab/run_lab.sh
          PASSED=$(grep -c '  PASS ' lab/out/lab.txt || true)
          FAILED=$(grep -c '  FAIL ' lab/out/lab.txt || true)
          echo "::notice title=Lab::${PASSED}/$((PASSED+FAILED)) PASS — releasing v${{ steps.ver.outputs.version }}"
          [ "$FAILED" -eq 0 ]

      # ── 4. the Android toolchain (build-tools 35.0.1 is a HARD requirement) ─
      - name: Prepare Android SDK (platform 34 + build-tools 35.0.1)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          [ -d "$SDK" ] || SDK="$HOME/android-sdk"
          SDKM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager" "$(command -v sdkmanager || true)"; do
            [ -x "$c" ] && { SDKM="$c"; break; }
          done
          if [ -n "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          fi
          NEED=""
          [ -f "$SDK/platforms/android-34/android.jar" ] || NEED="$NEED platforms;android-34"
          [ -x "$SDK/build-tools/35.0.1/aapt2" ] || NEED="$NEED build-tools;35.0.1"
          if [ -n "$NEED" ]; then
            [ -n "$SDKM" ] || { echo "::error::no sdkmanager available to install$NEED"; exit 1; }
            "$SDKM" --sdk_root="$SDK" --install $NEED < /dev/null
          fi
          [ -x "$SDK/build-tools/35.0.1/aapt2" ] || { echo "::error::build-tools;35.0.1 missing"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # ── 5. build + sign with the PERMANENT keystore (or refuse) ───────────
      - name: Build + sign the release APK
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_KEYPASS: ${{ secrets.KS_KEYPASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          PREV_VERSION_CODE: ${{ steps.prev.outputs.previous_version_code }}
        run: |
          set -euo pipefail
          if [ -z "$KS_BASE64" ]; then
            echo "::error title=No signing key::KS_BASE64 is not set. Run scripts/create-release-keystore.sh (or .ps1) once and add the 4 secrets. A debug-signed RELEASE would break in-place updates for every user."
            exit 1
          fi
          chmod +x build.sh
          bash build.sh

      - name: Verify the release APK (signature + version + assets)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="dist/AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk"
          test -s "$APK"
          echo "size: $(stat -c %s "$APK") bytes"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c 4 "$APK"
          "$BT/aapt2" dump badging "$APK" | head -2
          "$BT/aapt2" dump badging "$APK" | head -1 | grep -q "versionCode='${{ steps.ver.outputs.code }}'" \
            || { echo "::error::versionCode mismatch"; exit 1; }
          "$BT/aapt2" dump badging "$APK" | head -1 | grep -q "versionName='${{ steps.ver.outputs.version }}'" \
            || { echo "::error::versionName mismatch"; exit 1; }
          unzip -l "$APK" | grep -E "classes.*dex|AndroidManifest.xml|assets/fonts/NotoSansSinhala-Regular.ttf"

      - name: SHA256SUMS.txt (the integrity file next to the APK)
        run: |
          set -euo pipefail
          cd dist
          APK="AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk"
          sha256sum "$APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── 6. the tag (manual dispatch) + the Release ─────────────────────────
      - name: Create the git tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists — reusing it"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish the GitHub Release (one APK + SHA256SUMS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AnantPlay Sinhala Player v${{ steps.ver.outputs.version }}
          body: |
            # AnantPlay සිංහල Player v${{ steps.ver.outputs.version }}

            **Zero fork · zero accessibility · official AnantPlay untouched.**

            ## What is in this release
            - Router-free cast discovery (own RFC-6762 mDNS responder + honest 3-layer self-test)
            - Noisy-title cleaning for subtitle lookup on arbitrary streaming sites
            - DoH-based ISP-block diagnostics + one-tap playback retry
            - In-app GitHub update checker + the Obtainium pipeline

            ## Install / update
            - **Obtainium users**: this release is detected automatically (one unambiguous
              `.apk` asset). Updates install in place — no uninstall ever.
            - **Manual**: download `AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk`
              and install over the previous version (same permanent signing key).
            - Verify with `SHA256SUMS.txt`.

            Full story: see `ROUTER_FREE_CAST_AND_OBTAINIUM_REPORT.md` in the repo.
          files: |
            dist/AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Release summary
        if: always()
        run: |
          {
            echo '### Release pipeline'
            echo ''
            echo '| item | value |'
            echo '| --- | --- |'
            echo "| version | ${{ steps.ver.outputs.version }} (versionCode ${{ steps.ver.outputs.code }}) |"
            echo "| apk | AnantPlay-Sinhala-Player-v${{ steps.ver.outputs.version }}.apk |"
            if [ -f dist/SHA256SUMS.txt ]; then
              echo "| sha256 | $(cut -d' ' -f1 dist/SHA256SUMS.txt) |"
            fi
            echo "| signing | ${{ secrets.KS_BASE64 != '' && 'permanent release keystore' || 'REFUSED (no KS_BASE64)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
