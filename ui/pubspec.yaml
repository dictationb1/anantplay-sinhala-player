name: anantplay_ui
description: >-
  AnantPlay Sinhala Player v3.4.6.a — the Mornye v5.4.0 Liquid-Glass Flutter UI
  (vendored under LGPL-3.0-only) over the native Media3 cast/player backend.
publish_to: "none"
# v3.4.6.a — pub_semver forbids a 4-part core ("3.4.6.a" → Version.parse
# throws, which kills EVERY `flutter pub get`: .dart_tool/package_graph.json
# embeds p.version verbatim). The identity therefore rides as build metadata
# on the valid 3.4.6 core, while the description above carries "v3.4.6.a".
# The APK identity stays in android/app/build.gradle (3.4.6.a / 30407).
version: 3.4.6+30407.a

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State management (Mornye v5.4.0 pubspec.lock pin: flutter_riverpod 3.5.0)
  flutter_riverpod: 3.5.0

  # Pure-SVG Liquid-Glass Cinema asset rendering
  flutter_svg: ^2.2.1

  # The Mornye visual-engine stack — exact upstream pubspec.lock pins
  liquid_glass_easy: 5.2.0
  material_ui: 1.11.0
  cupertino_ui: 1.1.6
  material_3_expressive: 1.2.1
  material_color_utilities: 0.13.0
  material_symbols_icons: 4.2960.0
  dynamic_color: 2.1.0
  cupertino_icons: 2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  shaders:
    - assets/shaders/mornye_selection_mask.frag

  # v3.4.6 FIX: the vendored engine's licence files live at
  # lib/mornye_ui/{LICENSE,COPYING,NOTICE} (the delta asked for "mornye/…",
  # a directory that does not exist → `flutter pub get` aborted with
  # "asset directory doesn't exist"). They are packaged under assets/mornye/
  # and shown verbatim by Settings → Open-source licenses.
  assets:
    - assets/mornye/LICENSE
    - assets/mornye/COPYING
    - assets/mornye/NOTICE
    - assets/onboarding/
    - assets/empty/
    - assets/icons/
    - assets/brand/

  fonts:
    - family: Noto Sans Sinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSinhala-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf

  # This section identifies this Flutter project as a module meant for
  # embedding in the native host app (the add-to-app contract the Gradle host
  # consumes via include_flutter.groovy).
  module:
    androidX: true
    androidPackage: lk.techworld.anantplay.anantplay_ui
    iosBundleIdentifier: lk.techworld.anantplay.anantplayUi
